<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Scanner widget</title><meta name="robots" content="noindex,follow">
<style>
:root{--ink:#0f3460;--ink2:#46546b;--mute:#7a8699;--line:#e2e7ee;--line2:#eef1f5;--brand:#1a7f6e;--up:#13805c;--dn:#c23b32}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
.w{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hd{padding:12px 14px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hd h1{font-size:16px;margin:0 0 2px}.hd p{margin:0;font-size:12px;color:var(--mute)}
.hd a.b{flex:0 0 auto;font-size:12.5px;font-weight:600;color:#fff;background:var(--brand);text-decoration:none;border-radius:7px;padding:6px 10px;white-space:nowrap}
table{width:100%;border-collapse:collapse}th{font-size:11.5px;color:var(--mute);font-weight:600;text-align:left;padding:7px 12px;background:#fafbfc;border-bottom:1px solid var(--line)}
td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:top}tr:last-child td{border-bottom:0}.n{text-align:right;white-space:nowrap}
td a{color:var(--ink);font-weight:700;text-decoration:none}td a:hover{text-decoration:underline}td small{display:block;color:var(--mute);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.up{color:var(--up)}.dn{color:var(--dn)}.mute{color:var(--mute)}
.ft{padding:8px 14px;font-size:11px;color:var(--mute);border-top:1px solid var(--line2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ft a{color:var(--ink2)}.empty{padding:18px 14px;color:var(--ink2)}
@media (max-width:420px){.hide-s{display:none}}
</style></head><body>
<div class="w" id="w"><div class="empty">Loading&#8230;</div></div>
<script>
(function(){
  var SCREENER_URL = 'https://mnclgroup-mum.github.io/stock-scanner-data/stock-scanner/', META = [{"id":"gainers","k":"scr","slug":"top-gainers-today","title":"Top gainers today"},{"id":"losers","k":"scr","slug":"top-losers-today","title":"Top losers today"},{"id":"high52","k":"scr","slug":"52-week-high-stocks","title":"Stocks at a 52-week high"},{"id":"low52","k":"scr","slug":"52-week-low-stocks","title":"Stocks at a 52-week low"},{"id":"high5y","k":"scr","slug":"5-year-high-stocks","title":"Stocks at a 5-year high"},{"id":"ath","k":"scr","slug":"all-time-high-stocks","title":"Stocks at an all-time high"},{"id":"atl","k":"scr","slug":"all-time-low-stocks","title":"Stocks at an all-time low"},{"id":"gapup","k":"scr","slug":"gap-up-stocks","title":"Gap up"},{"id":"gapdown","k":"scr","slug":"gap-down-stocks","title":"Gap down"},{"id":"volume","k":"scr","slug":"volume-shockers","title":"Volume shockers"},{"id":"active","k":"scr","slug":"most-active-stocks","title":"Most active stocks by turnover"},{"id":"delivery","k":"scr","slug":"high-delivery-stocks","title":"High delivery percentage"},{"id":"uptrend","k":"scr","slug":"stocks-in-uptrend","title":"Stocks in an uptrend (Stage 2)"},{"id":"downtrend","k":"scr","slug":"stocks-in-downtrend","title":"Stocks in a downtrend (Stage 4)"},{"id":"breakout","k":"scr","slug":"breakout-stocks-today","title":"Fresh 20-day breakouts"},{"id":"breakdown","k":"scr","slug":"breakdown-stocks-today","title":"Fresh 20-day breakdowns"},{"id":"golden","k":"scr","slug":"golden-crossover-stocks","title":"Golden crossover stocks"},{"id":"death","k":"scr","slug":"death-cross-stocks","title":"Death cross stocks"},{"id":"above200","k":"scr","slug":"stocks-above-200-dma","title":"Stocks crossing above the 200-day average"},{"id":"below200","k":"scr","slug":"stocks-below-200-dma","title":"Stocks crossing below the 200-day average"},{"id":"momentum","k":"scr","slug":"momentum-stocks","title":"Momentum stocks (score 80+)"},{"id":"up3","k":"scr","slug":"stocks-up-3-days-in-a-row","title":"Stocks up 3 or more sessions in a row"},{"id":"down3","k":"scr","slug":"stocks-down-3-days-in-a-row","title":"Stocks down 3 or more sessions in a row"},{"id":"oversold","k":"scr","slug":"rsi-oversold-stocks","title":"RSI oversold (14-day RSI 30 or below)"},{"id":"overbought","k":"scr","slug":"rsi-overbought-stocks","title":"RSI overbought (14-day RSI 70 or above)"},{"id":"macdup","k":"scr","slug":"macd-bullish-crossover-stocks","title":"MACD bullish crossover"},{"id":"macddn","k":"scr","slug":"macd-bearish-crossover-stocks","title":"MACD bearish crossover"},{"id":"stup","k":"scr","slug":"supertrend-buy-signal-stocks","title":"Supertrend turned up"},{"id":"stdn","k":"scr","slug":"supertrend-sell-signal-stocks","title":"Supertrend turned down"},{"id":"ema921","k":"scr","slug":"ema-crossover-stocks","title":"EMA 9 crossed above EMA 21"},{"id":"adx","k":"scr","slug":"adx-strong-trend-stocks","title":"Strong uptrend by ADX"},{"id":"bbsq","k":"scr","slug":"bollinger-band-squeeze-stocks","title":"Bollinger Band squeeze"},{"id":"bbup","k":"scr","slug":"bollinger-band-breakout-stocks","title":"Close above the upper Bollinger Band"},{"id":"stochup","k":"scr","slug":"stochastic-oversold-crossover-stocks","title":"Stochastic bullish cross from oversold"},{"id":"don55","k":"scr","slug":"55-day-breakout-stocks","title":"55-day (Donchian) breakout"},{"id":"nr7","k":"scr","slug":"nr7-stocks","title":"NR7: narrowest range in 7 sessions"},{"id":"insidebar","k":"scr","slug":"inside-bar-stocks","title":"Inside bar"},{"id":"folbu","k":"fo","slug":"long-build-up-stocks","title":"Long build-up stocks (F&O)"},{"id":"fosbu","k":"fo","slug":"short-build-up-stocks","title":"Short build-up stocks (F&O)"},{"id":"foscov","k":"fo","slug":"short-covering-stocks","title":"Short covering stocks (F&O)"},{"id":"folunw","k":"fo","slug":"long-unwinding-stocks","title":"Long unwinding stocks (F&O)"},{"id":"fooi","k":"fo","slug":"open-interest-gainers","title":"Highest increase in open interest"},{"id":"foban","k":"fo","slug":"fno-ban-list-today","title":"Securities in the F&O ban period"},{"id":"caup","k":"ca","slug":"upcoming-corporate-actions","title":"Upcoming corporate actions"},{"id":"carecent","k":"ca","slug":"recent-corporate-actions","title":"Corporate actions in the last 30 days"}], SITE = {"brand":"","appName":"Stock Scanner","title":"Stock Scanner","short":"Stock Scanner","orgName":"","orgUrl":"","regNote":"","disclaimer":"Fully automatic screener based on technical rules, for educational reference only. Not a buy/sell recommendation. Please contact a SEBI-registered investment adviser. We shall not be responsible for any profit or loss from using this data.","siteUrl":"","scannerPath":"stock-scanner","marketPath":"share-market-today","scannerUrl":"https://mnclgroup-mum.github.io/stock-scanner-data/stock-scanner/","marketUrl":"https://mnclgroup-mum.github.io/stock-scanner-data/share-market-today/","webHosts":[],"hosts":["localhost","127.0.0.1","mnclgroup-mum.github.io"],"legacyPrefix":"","privacyUrl":"","ogImage":"","guideBase":"","ctaText":"","ctaUrl":"","pathRoutes":false,"pagesBase":"https://mnclgroup-mum.github.io/stock-scanner-data/","dataBase":"https://mnclgroup-mum.github.io/stock-scanner-data/data/","dataRaw":"https://raw.githubusercontent.com/mnclgroup-mum/stock-scanner-data/main/data/","hide":["setup:intraday","setup:swing","setup:positional","setup:weak","setup:reversal","setup:accumulation","tab:ideas"],"gas":"https://script.google.com/macros/s/AKfycbyq3rAvyse__FASkf1JB1n61NSalgqmnxfY7K8FS1g_HjtJ3hdG1OUfVFLRtzzSDOWM/exec","v":"v12.1","publisher":"Stock Scanner","home":"https://mnclgroup-mum.github.io/stock-scanner-data/","loader":"https://mnclgroup-mum.github.io/stock-scanner-data/app/loader.js"}, TITLE = SITE.title || 'Stock scanner', PFX = SITE.legacyPrefix || '';
  var q = {}; location.search.replace(/^\?/, '').split('&').forEach(function(kv){ var i = kv.indexOf('='); if (kv) q[decodeURIComponent(kv.slice(0, i < 0 ? kv.length : i))] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1)); });
  var key = String(q.screen || 'top-gainers-today').toLowerCase(), rowsN = Math.min(50, Math.max(3, parseInt(q.rows || '10', 10) || 10));
  var m = META.filter(function(x){ return x.slug === key || x.id === key; })[0] || META[0];
  function h(s){ return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function f(v){ v = parseFloat(v); return isFinite(v) ? '₹' + v.toLocaleString('en-IN', { maximumFractionDigits: v >= 1000 ? 0 : 2 }) : '–'; }
  function p(v){ v = parseFloat(v); return isFinite(v) ? '<span class="' + (v > 0 ? 'up' : v < 0 ? 'dn' : 'mute') + '">' + (v > 0 ? '+' : '') + v.toFixed(2) + '%</span>' : '–'; }
  function fmtIso(iso){ if (!iso) return ''; var a = iso.split('-'); return parseInt(a[2], 10) + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(a[1], 10) - 1] + ' ' + a[0]; }
  function get(n, v){ return fetch('data/' + n + '.json?v=' + encodeURIComponent(v)).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function size(){ var hh = document.documentElement.scrollHeight; try { parent.postMessage({ type: 'scanner-embed-height', screen: m.slug, h: hh }, '*'); if (PFX) parent.postMessage({ type: PFX + '-embed-height', screen: m.slug, h: hh }, '*'); } catch (e) {} }
  var link = SCREENER_URL + '#' + m.slug;
  // [v11.13] the widget shows data only inside allowed sites (or opened directly); list from Admin > Site settings
  function okHost(u){ if (/^file:/i.test(u)) return true; var hn = ''; try { hn = new URL(u).hostname.toLowerCase(); } catch (x) { return false; } return (SITE.hosts || []).some(function(x){ x = String(x).toLowerCase(); return x.charAt(0) === '.' ? (hn === x.slice(1) || hn.slice(-x.length) === x) : (hn === x || hn === 'www.' + x || 'www.' + hn === x); }); }
  var framed = false; try { framed = window.self !== window.top; } catch (x) { framed = true; }
  if (framed) {
    var anc = ''; try { anc = (location.ancestorOrigins && location.ancestorOrigins.length) ? location.ancestorOrigins[location.ancestorOrigins.length - 1] : document.referrer; } catch (x) {}
    if (!okHost(anc)) { document.getElementById('w').innerHTML = '<div class="empty"><a href="' + h(link) + '" target="_blank" rel="noopener">' + h(m.title) + ' on the ' + h(TITLE) + '</a></div>'; size(); return; }
  }
  function draw(rows, date, extraHead){

      rows.slice(0, rowsN).map(function(r){ return '<tr><td><a href="' + h(link + '/' + String(r.s).toLowerCase()) + '" target="_blank" rel="noopener">' + h(r.s) + '</a><small>' + h(r.n || '') + '</small></td><td class="n">' + f(r.c) + '</td><td class="n">' + p(r.chg) + '</td>' + (extraHead ? '<td class="n hide-s">' + (r.x === undefined ? '–' : r.x) + '</td>' : '') + '</tr>'; }).join('') + '</tbody></table>'

    document.getElementById('w').innerHTML = '<div class="hd"><div><h1>' + h(m.title) + '</h1><p>' + (date ? 'Session ' + h(fmtIso(date)) + ' · ' : '') + rows.length + ' stock' + (rows.length === 1 ? '' : 's') + ' · NSE end-of-day data</p></div><a class="b" href="' + h(link) + '" target="_blank" rel="noopener">Full screener &#8250;</a></div>' + body +
      '<div class="ft"><span>Automatic technical screen for educational reference. Not a buy/sell recommendation; consult a SEBI-registered investment adviser.</span><a href="' + h(link) + '" target="_blank" rel="noopener">' + h(TITLE) + '</a></div>';

  }

      var S = a[0], list = (S.lists && S.lists[m.id]) || [];
      draw(list.map(function(r){ return { s: r.s, n: r.n, c: r.c, chg: r.chg }; }), S.date_iso);

      draw(list.map(function(r){ return { s: r.symbol, n: r.name, c: r.close, chg: r.prev ? (r.close / r.prev - 1) * 100 : null, x: r.score }; }), I.date_iso, 'Score'); });
    if (m.k === 'fo') return Promise.all([get('fo', v), get('universe', v)]).then(function(a){
      var F = a[0], U = a[1], by = {}; U.rows.forEach(function(r){ by[r[0]] = r[1]; });
      var key2 = { folbu: 'lbu', fosbu: 'sbu', foscov: 'scov', folunw: 'lunw' }[m.id], rows = (F.rows || []);
      rows = m.id === 'foban' ? rows.filter(function(r){ return F.ban && F.ban.list.indexOf(r.s) !== -1; }) : m.id === 'fooi' ? rows.filter(function(r){ return r.oic > 0; }).sort(function(x, y){ return y.oic - x.oic; }) : rows.filter(function(r){ return r.b === key2; }).sort(function(x, y){ return Math.abs(y.oic) - Math.abs(x.oic); });
      draw(rows.map(function(r){ return { s: r.s, n: by[r.s], c: r.fc, chg: r.chg, x: r.oic !== null ? (r.oic > 0 ? '+' : '') + r.oic.toFixed(1) + '%' : '–' }; }), F.date_iso, 'OI change');
    });
    if (m.k === 'ca') return Promise.all([get('corpact', v), get('universe', v)]).then(function(a){
      var C = a[0], U = a[1], cols = U.cols, by = {}; U.rows.forEach(function(r){ by[r[0]] = { n: r[cols.indexOf('n')], c: r[cols.indexOf('c')], chg: r[cols.indexOf('chg')] }; });
      var ref = U.date_iso || C.date_iso, rows = (C.rows || []).filter(function(r){ return !r.se && (m.id === 'caup' ? r.ex > ref : r.ex <= ref); });
      if (m.id === 'caup') rows.sort(function(x, y){ return x.ex < y.ex ? -1 : 1; });
      draw(rows.map(function(r){ var u = by[r.s] || {}; return { s: r.s, n: u.n || r.n, c: u.c, chg: u.chg, x: h(fmtIso(r.ex)) + '<br><small>' + h(r.p) + '</small>' }; }), ref, 'Ex-date');
    });
    document.getElementById('w').innerHTML = '<div class="empty">This screen cannot be embedded. <a href="' + h(link) + '" target="_blank" rel="noopener">Open it in the scanner</a>.</div>'; size();
  }).catch(function(){ document.getElementById('w').innerHTML = '<div class="empty">Data could not be loaded. <a href="' + h(link) + '" target="_blank" rel="noopener">Open the scanner</a>.</div>'; size(); });
  window.addEventListener('resize', size);
})();
</script></body></html>
